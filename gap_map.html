<style>
  :root{
    --bg:#0E1A2B; --panel:#122A46; --panel-alt:#173355; --line:#264566;
    --amber:#E8A33D; --amber-dim:#8A6528; --teal:#57C7B8; --text:#EDF1F7; --muted:#8CA0BC;
    --danger:#E2734A; --low:#3FA796;
  }
  .lsm-root{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .lsm-header{ display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:16px 22px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .lsm-title{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; font-size:16px; }
  .lsm-title span{ color:var(--amber); }
  .lsm-sub{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .lsm-body{ display:flex; }
  @media (max-width:820px){ .lsm-body{ flex-direction:column; } }

  .lsm-map-col{ flex:1.15; padding:16px; position:relative; border-right:1px solid var(--line); min-width:0; }
  @media (max-width:820px){ .lsm-map-col{ border-right:none; border-bottom:1px solid var(--line); } }
  .lsm-map-col svg{ width:100%; height:auto; display:block; }
  .lsm-borough{ stroke:#0E1A2B; stroke-width:1; cursor:pointer; transition:filter .1s ease, stroke-width .1s ease; }
  .lsm-borough:hover{ filter:brightness(1.18); stroke:#fff; stroke-width:1.6; }
  .lsm-borough.selected{ stroke:var(--amber); stroke-width:2.4; }
  .lsm-borough.no-data{ fill:url(#lsm-hatch) !important; }
  .lsm-label{ font-family:'IBM Plex Mono',monospace; font-size:6.4px; fill:rgba(237,241,247,0.75);
    pointer-events:none; text-anchor:middle; }

  .lsm-legend{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:11px; color:var(--muted);
    font-family:'IBM Plex Mono',monospace; flex-wrap:wrap; }
  .lsm-legend-bar{ width:140px; height:8px; border-radius:4px;
    background:linear-gradient(90deg,var(--low),#E8D67A,var(--danger)); }
  .lsm-legend-hatch{ width:14px; height:8px; border-radius:2px; background:repeating-linear-gradient(45deg,#33465F,#33465F 2px,#243550 2px,#243550 4px); }

  .lsm-tooltip{ position:absolute; pointer-events:none; background:var(--panel-alt); border:1px solid var(--line);
    border-radius:6px; padding:8px 11px; font-size:12px; opacity:0; transition:opacity .08s ease; z-index:5;
    box-shadow:0 6px 18px rgba(0,0,0,0.35); min-width:150px; }
  .lsm-tooltip-name{ font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:12.5px; letter-spacing:.02em; }
  .lsm-tooltip-gap{ font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:15px; margin-top:2px; }
  .lsm-tooltip-note{ color:var(--muted); font-size:10.5px; margin-top:2px; }

  .lsm-detail{ flex:1; padding:20px 24px; overflow-y:auto; max-height:640px; min-width:280px; }
  .lsm-detail-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .lsm-borough-name{ font-family:'Oswald',sans-serif; font-size:24px; font-weight:600;
    text-transform:uppercase; letter-spacing:.01em; }
  .lsm-rank-badge{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--bg);
    background:var(--amber); padding:3px 9px; border-radius:3px; font-weight:600; letter-spacing:.04em; }
  .lsm-rank-badge.muted{ background:var(--line); color:var(--muted); }

  .lsm-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:16px 0; }
  .lsm-stat{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .lsm-stat-label{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;
    font-family:'IBM Plex Mono',monospace; }
  .lsm-stat-value{ font-family:'IBM Plex Mono',monospace; font-size:19px; margin-top:3px; }
  .lsm-stat-value.amber{ color:var(--amber); } .lsm-stat-value.teal{ color:var(--teal); }
  .lsm-stat-value.danger{ color:var(--danger); }

  .lsm-notice{ background:rgba(232,163,61,0.1); border:1px solid var(--amber-dim); border-radius:6px;
    padding:9px 12px; font-size:12.5px; color:var(--amber); margin:14px 0; }

  .lsm-section-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
  .lsm-flags{ display:flex; flex-direction:column; gap:6px; }
  .lsm-flag{ display:flex; justify-content:space-between; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; padding:8px 12px; font-size:13px; }
  .lsm-flag-var{ color:var(--muted); font-size:11px; margin-left:6px; }
  .lsm-flag-pct{ font-family:'IBM Plex Mono',monospace; color:var(--danger); }

  .lsm-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .lsm-chip{ font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:5px 12px; color:var(--muted); }
  .lsm-chip b{ color:var(--text); font-weight:500; }

  .lsm-btn{ margin-top:20px; background:var(--amber); color:#1A1204; border:none; border-radius:6px;
    padding:11px 18px; font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; font-size:13px; cursor:pointer; }
  .lsm-btn:hover{ filter:brightness(1.08); }
  .lsm-btn:disabled{ opacity:.5; cursor:default; }

  .lsm-briefing{ margin-top:16px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .lsm-briefing-head{ background:var(--panel-alt); padding:8px 14px; font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:.1em; color:var(--amber); text-transform:uppercase; }
  .lsm-briefing-body{ padding:16px; background:var(--panel); font-size:14px; line-height:1.55; }
  .lsm-b-block{ margin-bottom:14px; } .lsm-b-block:last-child{ margin-bottom:0; }
  .lsm-b-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
    color:var(--teal); text-transform:uppercase; margin-bottom:4px; }
  .lsm-b-action{ display:flex; gap:8px; margin-bottom:6px; align-items:baseline; }
  .lsm-b-action::before{ content:"\2192"; color:var(--amber); flex-shrink:0; }
  .lsm-loading{ color:var(--muted); font-size:13px; font-family:'IBM Plex Mono',monospace; margin-top:14px; }
  .lsm-error{ color:var(--danger); font-size:13px; }
</style>

53,51.41775],[-0.15985,51.42265],[-0.16156,51.41988],[-0.16506,51.4201],[-0.18191,51.42475],[-0.18573,51.43318],[-0.18976,51.43136],[-0.19103,51.43306],[-0.19001,51.44149],[-0.21221,51.43788],[-0.23105,51.4382],[-0.25106,51.43258],[-0.25406,51.43731],[-0.2416,51.44315],[-0.2473,51.4492],[-0.25909,51.45495],[-0.25802,51.46029],[-0.25289,51.46523],[-0.23328,51.46401],[-0.23146,51.47285],[-0.2237,51.47078],[-0.2217,51.47238],[-0.2048,51.46469],[-0.19014,51.46433],[-0.18286,51.46754],[-0.17778,51.47757],[-0.17333,51.48095],[-0.12953,51.48592],[-0.12625,51.4845],[-0.13462,51.47339],[-0.15119,51.4659],[-0.14771,51.45232],[-0.14229,51.45098],[-0.14566,51.44579],[-0.14361,51.44179],[-0.13596,51.44201],[-0.14004,51.43684],[-0.1353,51.4303],[-0.13839,51.43047],[-0.13781,51.42112],[-0.14453,51.41775]]]}},{"type":"Feature","properties":{"name":"Westminster"},"geometry":{"type":"Polygon","coordinates":[[[-0.11164,51.51535],[-0.11142,51.50976],[-0.12064,51.50583],[-0.12301,51.4935],[-0.12735,51.4874],[-0.1371,51.48394],[-0.1498,51.48458],[-0.15583,51.48962],[-0.15498,51.49388],[-0.15843,51.50227],[-0.16547,51.49872],[-0.17953,51.4978],[-0.1803,51.50148],[-0.18422,51.50181],[-0.1879,51.5102],[-0.19211,51.50989],[-0.19504,51.51505],[-0.19917,51.51457],[-0.20364,51.52061],[-0.20056,51.52067],[-0.20155,51.52277],[-0.20668,51.52618],[-0.21548,51.52676],[-0.21598,51.52919],[-0.21517,51.53141],[-0.20285,51.53294],[-0.19653,51.52768],[-0.19145,51.53631],[-0.18874,51.53455],[-0.179,51.53978],[-0.16492,51.5358],[-0.15269,51.53754],[-0.14715,51.52506],[-0.13079,51.51712],[-0.12932,51.5135],[-0.11164,51.51535]]]}}]};
  const byName = {}; PROFILES.forEach(p => byName[p.borough] = p);

  const gapValues = PROFILES.map(p => p.pct_inactive);
  const gapMin = Math.min(...gapValues), gapMax = Math.max(...gapValues);
  const colorScale = d3.scaleLinear()
    .domain([gapMin, (gapMin+gapMax)/2, gapMax])
    .range(["#3FA796", "#E8D67A", "#E2734A"]);

  const svg = d3.select("#lsm-svg");
  const width = 560, height = 480;
  const projection = d3.geoMercator().fitSize([width, height], GEO);
  const path = d3.geoPath().projection(projection);

  const defs = svg.append("defs");
  const hatch = defs.append("pattern").attr("id","lsm-hatch").attr("width",6).attr("height",6)
    .attr("patternTransform","rotate(45)").attr("patternUnits","userSpaceOnUse");
  hatch.append("rect").attr("width",6).attr("height",6).attr("fill","#243550");
  hatch.append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",6).attr("stroke","#33465F").attr("stroke-width",3);

  let selected = PROFILES.slice().sort((a,b) => (a.rank||99) - (b.rank||99))[0].borough;
  const briefingCache = {};
  const tooltip = document.getElementById("lsm-tooltip");
  const mapCol = document.querySelector(".lsm-map-col");

  svg.selectAll("path.lsm-borough")
    .data(GEO.features)
    .enter().append("path")
    .attr("class", d => "lsm-borough" + (byName[d.properties.name] && byName[d.properties.name].no_supply_data ? " no-data" : ""))
    .attr("d", path)
    .attr("fill", d => {
      const p = byName[d.properties.name];
      return p ? colorScale(p.pct_inactive) : "#243550";
    })
    .on("mousemove", function(event, d){
      const p = byName[d.properties.name];
      if(!p) return;
      const rect = mapCol.getBoundingClientRect();
      const x = event.clientX - rect.left, y = event.clientY - rect.top;
      tooltip.style.left = Math.min(x + 14, rect.width - 165) + "px";
      tooltip.style.top = Math.max(y - 50, 4) + "px";
      tooltip.style.opacity = 1;
      tooltip.innerHTML = '<div class="lsm-tooltip-name">' + p.borough + '</div>' +
        '<div class="lsm-tooltip-gap">' + p.pct_inactive + '% <span style="font-size:10px;color:var(--muted);">gap score</span></div>' +
        (p.rank ? '<div class="lsm-tooltip-note">Priority rank ' + p.rank + ' / 31</div>' : '<div class="lsm-tooltip-note">No OpenActive supply data</div>');
    })
    .on("mouseleave", function(){ tooltip.style.opacity = 0; })
    .on("click", function(event, d){
      const p = byName[d.properties.name];
      if(!p) return;
      selected = p.borough;
      updateSelectedStyling();
      renderDetail();
    });

  svg.selectAll("text.lsm-label")
    .data(GEO.features)
    .enter().append("text")
    .attr("class","lsm-label")
    .attr("transform", d => "translate(" + path.centroid(d) + ")")
    .text(d => d.properties.name.length > 14 ? "" : d.properties.name.toUpperCase());

  function updateSelectedStyling(){
    svg.selectAll("path.lsm-borough").classed("selected", d => d.properties.name === selected);
  }
  updateSelectedStyling();

  function statClass(v, kind){
    if(kind === 'residual') return v > 5 ? 'danger' : (v < -2 ? 'teal' : 'amber');
    if(kind === 'trend') return v > 0.3 ? 'danger' : (v < -0.1 ? 'teal' : 'amber');
    return 'amber';
  }

  function renderDetail(){
    const p = byName[selected];
    const detailEl = document.getElementById('lsm-detail');
    const rankBadge = p.rank ? '<div class="lsm-rank-badge">RANK ' + String(p.rank).padStart(2,'0') + ' / 31</div>'
                              : '<div class="lsm-rank-badge muted">NO SUPPLY DATA</div>';
    let statsHtml = '<div class="lsm-stats">' +
      '<div class="lsm-stat"><div class="lsm-stat-label">% Inactive (Gap)</div><div class="lsm-stat-value danger">' + p.pct_inactive + '%</div></div>';
    if(p.predicted_inactive !== null){
      const trendTxt = p.trend_slope === null ? 'n/a' : (p.trend_slope > 0 ? '+' : '') + p.trend_slope + ' pt/yr';
      statsHtml += '<div class="lsm-stat"><div class="lsm-stat-label">Model Predicted</div><div class="lsm-stat-value teal">' + p.predicted_inactive + '%</div></div>' +
        '<div class="lsm-stat"><div class="lsm-stat-label">Residual</div><div class="lsm-stat-value ' + statClass(p.residual,'residual') + '">' + (p.residual>0?'+':'') + p.residual + '</div></div>' +
        '<div class="lsm-stat"><div class="lsm-stat-label">7yr Trend</div><div class="lsm-stat-value ' + statClass(p.trend_slope||0,'trend') + '">' + trendTxt + '</div></div>';
    }
    statsHtml += '</div>';

    let supplyHtml = '';
    if(p.supply){
      supplyHtml = '<div class="lsm-section-label">Supply snapshot</div><div class="lsm-chips">' +
        '<div class="lsm-chip"><b>' + p.supply.n_sessions + '</b> sessions/wk</div>' +
        '<div class="lsm-chip"><b>' + p.supply.n_providers + '</b> providers</div>' +
        '<div class="lsm-chip"><b>' + p.supply.pct_free + '%</b> free</div>' +
        '<div class="lsm-chip"><b>' + p.supply.n_activity_types + '</b> activity types</div>' +
        (p.supply.top_activities[0] ? '<div class="lsm-chip">Top: <b>' + p.supply.top_activities[0].type + '</b></div>' : '') +
      '</div>';
    } else {
      supplyHtml = '<div class="lsm-notice">No OpenActive session listings are currently indexed for this borough, so a supply-side priority score can\u2019t be computed. Demand-side data (below) is still available.</div>';
    }

    detailEl.innerHTML =
      '<div class="lsm-detail-top"><div class="lsm-borough-name">' + p.borough + '</div>' + rankBadge + '</div>' +
      statsHtml + supplyHtml +
      '<div class="lsm-section-label">Who is most affected (demographic inactivity)</div>' +
      '<div class="lsm-flags">' +
        p.inequality_flags.map(f => '<div class="lsm-flag"><span>' + f.group +
          '<span class="lsm-flag-var">' + f.variable + '</span></span><span class="lsm-flag-pct">' + f.pct_inactive + '% inactive</span></div>').join('') +
      '</div>' +
      '<button class="lsm-btn" id="lsm-gen">Generate Investment Briefing</button>' +
      '<div id="lsm-briefing-slot"></div>';

    document.getElementById('lsm-gen').addEventListener('click', () => generateBriefing(p));
    if(briefingCache[p.borough]) renderBriefing(briefingCache[p.borough]);
  }

  function renderBriefing(b){
    const slot = document.getElementById('lsm-briefing-slot');
    if(!slot) return;
    if(b.error){
      slot.innerHTML = '<div class="lsm-briefing"><div class="lsm-briefing-head">Briefing</div>' +
        '<div class="lsm-briefing-body"><div class="lsm-error">' + b.error + '</div></div></div>';
      return;
    }
    slot.innerHTML = '<div class="lsm-briefing"><div class="lsm-briefing-head">Investment Briefing &mdash; AI-drafted, grounded in ML output</div>' +
      '<div class="lsm-briefing-body">' +
        '<div class="lsm-b-block"><div class="lsm-b-label">Situation</div>' + b.situation + '</div>' +
        '<div class="lsm-b-block"><div class="lsm-b-label">Who\u2019s most affected</div>' + b.affected + '</div>' +
        '<div class="lsm-b-block"><div class="lsm-b-label">Recommended action</div>' +
          b.actions.map(a => '<div class="lsm-b-action">' + a + '</div>').join('') +
        '</div>' +
        '<div class="lsm-b-block"><div class="lsm-b-label">Watch-out</div>' + b.watchout + '</div>' +
      '</div></div>';
  }

  async function generateBriefing(p){
    const slot = document.getElementById('lsm-briefing-slot');
    slot.innerHTML = '<div class="lsm-loading">Compiling briefing from borough data\u2026</div>';
    const btn = document.getElementById('lsm-gen');
    btn.disabled = true;
    try{
      const system = "You are a strategic analyst briefing London Sport's investment committee. " +
        "You will receive one borough's data from an ML pipeline (Random Forest inactivity model with SHAP, " +
        "K-Means demographic clustering, 7-year trend). Use ONLY the numbers provided \u2014 never invent statistics. " +
        "If supply is null, that means no OpenActive session data is indexed for this borough; say so plainly and " +
        "make 'improve activity-provision data coverage' one of the recommended actions, alongside demand-side actions. " +
        "Respond with ONLY a raw JSON object (no markdown fences, no prose outside it) matching exactly: " +
        '{"situation": "1-2 sentence summary", "affected": "1-2 sentences naming the most affected groups from inequality_flags", ' +
        '"actions": ["specific action 1", "specific action 2", "specific action 3"], "watchout": "1 sentence caveat"}. ' +
        "Keep it concise, plain, and specific to this borough's actual numbers.";
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 700,
          system: system,
          messages: [{ role: "user", content: JSON.stringify(p) }]
        })
      });
      const data = await resp.json();
      const textBlock = (data.content || []).find(c => c.type === "text");
      let raw = textBlock ? textBlock.text : "";
      raw = raw.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
      const parsed = JSON.parse(raw);
      briefingCache[p.borough] = parsed;
      renderBriefing(parsed);
    }catch(e){
      const err = { error: "Could not generate a briefing right now (" + e.message + "). The data above is still accurate \u2014 try again." };
      briefingCache[p.borough] = err;
      renderBriefing(err);
    }finally{
      btn.disabled = false;
    }
  }

  renderDetail();
})();
</script>
